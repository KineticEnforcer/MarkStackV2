<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users - MarkStack Editor</title>
<script nonce="__CSP_NONCE__">
try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
</script>
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<style>
  :root { color-scheme: dark; --bg:#0f1218; --panel:#151922; --raised:#1b2030; --text:#e6e9f0; --muted:#8b93a7; --line:#262c3b; --accent:#7b9bff; --accent-soft:rgba(123,155,255,.14); --on-accent:#0f1218; --err:#ff8a80; --ok:#6fd08c; --hover:#1b2030; }
  :root[data-theme="light"] { color-scheme: light; --bg:#ffffff; --panel:#f6f7f9; --raised:#eef0f4; --text:#1a1f2b; --muted:#667085; --line:#dfe3ea; --accent:#2f5bea; --accent-soft:rgba(47,91,234,.10); --on-accent:#ffffff; --err:#b3261e; --ok:#1b7f3b; --hover:#eef0f4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:600; color:var(--text); }
  .brand img { width:22px; height:22px; }
  .brand span.sub { font-weight:400; color:var(--muted); }
  label { display:block; margin:14px 0 6px; font-size:12px; font-weight:600; color:var(--muted); }
  input[type=text], input[type=password], input:not([type]), select { width:100%; height:36px; padding:0 12px; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent); }
  button { height:32px; padding:0 12px; font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  button:hover { background:var(--hover); }
  button.primary { color:var(--on-accent); background:var(--accent); border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.6; cursor:default; }
  .err { min-height:1.4em; margin-top:12px; color:var(--err); font-size:13px; }
  [hidden] { display:none !important; }
  header { display:flex; align-items:center; gap:16px; height:48px; padding:0 24px; border-bottom:1px solid var(--line); background:var(--panel); }
  header .grow { flex:1; }
  main { max-width:980px; margin:28px auto; padding:0 16px; }
  .top { display:flex; align-items:flex-end; gap:16px; margin-bottom:16px; }
  .top > div { flex:1; min-width:0; }
  h1 { margin:0 0 2px; font-size:22px; line-height:1.3; }
  p.lead { margin:0; color:var(--muted); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:11px 14px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  th { font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; background:var(--bg); }
  th.r, td.actions { text-align:right; white-space:nowrap; }
  td.u { font-weight:600; }
  .pill { display:inline-block; margin-left:6px; padding:0 8px; border:1px solid var(--line); border-radius:10px; font-size:11px; font-weight:500; color:var(--muted); }
  .pill.warn { color:var(--err); border-color:var(--err); }
  .role { color:var(--muted); text-transform:capitalize; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { padding:1px 8px; font-size:12px; background:var(--accent-soft); color:var(--accent); border-radius:10px; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip.more { background:var(--raised); color:var(--muted); }
  .muted { color:var(--muted); font-size:13px; }
  .actions button { margin-left:6px; min-width:84px; }
  .actions button.danger:hover { color:var(--err); border-color:var(--err); }
  .msg { min-height:1.4em; margin:12px 2px 0; font-size:13px; }
  .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
  code { padding:2px 6px; background:var(--bg); border:1px solid var(--line); border-radius:5px; user-select:all; font-family:"IBM Plex Mono", ui-monospace, monospace; }
  .secs { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:2px 12px; max-height:260px; overflow:auto; }
  .secs label { display:flex; gap:8px; align-items:center; margin:0; padding:5px 0; font-size:13px; font-weight:400; color:var(--text); }
  dialog { width:min(440px, calc(100vw - 24px)); max-height:calc(100vh - 24px); padding:0; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 20px 50px rgba(0,0,0,.35); overflow:auto; }
  dialog::backdrop { background:rgba(8,10,16,.55); }
  .dlg-h { padding:16px 20px 0; font-size:16px; font-weight:600; }
  .dlg-b { padding:4px 20px 8px; }
  .dlg-f { display:flex; justify-content:flex-end; gap:8px; padding:12px 20px 16px; }
  .dlg-b p { margin:10px 0 10px; }
  @media (max-width:720px) {
    header { padding:0 12px; }
    main { margin:16px auto; }
    .top { flex-wrap:wrap; }
    table, tbody, tr, td { display:block; width:100%; }
    thead { display:none; }
    tr { display:grid; grid-template-columns:1fr auto; gap:6px 10px; padding:12px 14px; border-bottom:1px solid var(--line); }
    tr:last-child { border-bottom:0; }
    td { padding:0; border:0; }
    td.u { grid-column:1; }
    td.r2 { grid-column:2; text-align:right; }
    td.sec { grid-column:1 / -1; }
    td.actions { grid-column:1 / -1; text-align:left; display:flex; flex-wrap:wrap; gap:6px; }
    .actions button { margin:0; flex:1 1 auto; min-width:0; padding:0 12px; height:36px; white-space:nowrap; }
    dialog button, .top button { height:38px; }
  }
</style>
</head>
<body>
<header><div class="brand"><img src="/svg/logo.svg" alt="" width="22" height="22"><span>MarkStack</span><span class="sub">Users</span></div><span class="grow"></span><a href="/">Back to the editor</a></header>
<main>
  <div class="top">
    <div><h1>Users and sections</h1><p class="lead">Editors can change only the sections assigned to them. Administrators can change everything.</p></div>
    <button class="primary" id="addOpen">Add user</button>
  </div>
  <div class="card">
    <table><thead><tr><th>User</th><th>Role</th><th>Sections</th><th class="r">Actions</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
  <div class="msg" id="listMsg" role="status"></div>
</main>

<dialog id="addDlg" aria-labelledby="addTitle">
  <form method="dialog" id="addForm" novalidate>
    <div class="dlg-h" id="addTitle">Add a user</div>
    <div class="dlg-b">
      <label for="newName">Username (lowercase letters, digits, . _ -)</label>
      <input id="newName" type="text" autocomplete="off">
      <label for="newRole">Role</label>
      <select id="newRole"><option value="editor">Editor</option><option value="admin">Administrator</option></select>
      <label for="newPass">Initial password (at least 12 characters)</label>
      <input id="newPass" type="password" autocomplete="new-password">
      <label id="newSecsLabel">Sections this editor may change</label>
      <div class="secs" id="newSecs"></div>
      <div class="msg" id="addMsg" role="status"></div>
    </div>
    <div class="dlg-f"><button type="button" id="addCancel">Cancel</button><button type="submit" class="primary" id="addBtn">Add user</button></div>
  </form>
</dialog>

<dialog id="secDlg" aria-labelledby="secTitle">
  <form method="dialog" id="secForm">
    <div class="dlg-h" id="secTitle">Sections</div>
    <div class="dlg-b">
      <p class="muted" id="secHint">Saving ends this user's sessions.</p>
      <div class="secs" id="secBox"></div>
      <div class="msg" id="secMsg" role="status"></div>
    </div>
    <div class="dlg-f"><button type="button" id="secCancel">Cancel</button><button type="submit" class="primary" id="secSave">Save sections</button></div>
  </form>
</dialog>

<dialog id="rstDlg" aria-labelledby="rstTitle">
  <form method="dialog" id="rstForm">
    <div class="dlg-h" id="rstTitle">Reset password</div>
    <div class="dlg-b">
      <p id="rstText"></p>
      <div class="msg" id="rstMsg" role="status"></div>
    </div>
    <div class="dlg-f"><button type="button" id="rstCancel">Cancel</button><button type="submit" class="primary" id="rstGo">Reset password</button></div>
  </form>
</dialog>

<script nonce="__CSP_NONCE__">
(function () {
  var csrf = null, sections = [], me = null;
  function api(method, url, body) {
    var h = {};
    if (body !== undefined) h['Content-Type'] = 'application/json';
    if (method !== 'GET') h['X-CSRF-Token'] = csrf;
    return fetch(url, { method: method, headers: h, credentials: 'same-origin', body: body === undefined ? undefined : JSON.stringify(body) })
      .then(function (r) {
        if (r.status === 401) { location.href = '/login'; return Promise.reject(new Error('signed out')); }
        return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw new Error(d.error || 'Request failed'); return d; });
      });
  }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); });
    (kids || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  function $(id) { return document.getElementById(id); }
  function checks(box, selected) {
    box.textContent = '';
    if (!sections.length) box.appendChild(el('span', { 'class': 'muted', text: 'No section folders exist yet.' }));
    sections.forEach(function (s) {
      var cb = el('input', { type: 'checkbox', value: s });
      cb.checked = selected.indexOf(s) !== -1;
      box.appendChild(el('label', {}, [cb, document.createTextNode(s)]));
    });
  }
  function picked(box) {
    return Array.prototype.slice.call(box.querySelectorAll('input:checked')).map(function (i) { return i.value; });
  }
  function msg(id, text, ok) { var m = $(id); m.textContent = text || ''; m.className = 'msg ' + (text ? (ok ? 'ok' : 'err') : ''); }
  function open(d) { if (d.showModal) d.showModal(); else d.setAttribute('open', ''); }
  function close(d) { if (d.close) d.close(); else d.removeAttribute('open'); }
  function summary(u) {
    var td = el('td', { 'class': 'sec' });
    if (u.role === 'admin') { td.appendChild(el('span', { 'class': 'muted', text: 'All sections' })); return td; }
    if (!u.sections.length) { td.appendChild(el('span', { 'class': 'muted', text: 'No sections' })); return td; }
    var box = el('div', { 'class': 'chips' });
    u.sections.slice(0, 3).forEach(function (s) { box.appendChild(el('span', { 'class': 'chip', title: s, text: s })); });
    if (u.sections.length > 3) box.appendChild(el('span', { 'class': 'chip more', title: u.sections.slice(3).join(', '), text: '+' + (u.sections.length - 3) }));
    td.appendChild(box);
    return td;
  }

  var secUser = null, rstUser = null;
  function render(users) {
    var rows = $('rows'); rows.textContent = '';
    users.forEach(function (u) {
      var tr = el('tr');
      var nameTd = el('td', { 'class': 'u', text: u.name });
      if (u.disabled) nameTd.appendChild(el('span', { 'class': 'pill warn', text: 'disabled' }));
      if (u.mustChangePassword) nameTd.appendChild(el('span', { 'class': 'pill', text: 'must change password' }));
      tr.appendChild(nameTd);
      tr.appendChild(el('td', { 'class': 'role r2', text: u.role === 'admin' ? 'Administrator' : 'Editor' }));
      tr.appendChild(summary(u));
      var act = el('td', { 'class': 'actions' });
      if (u.role === 'editor') {
        var ed = el('button', { type: 'button', text: 'Sections', 'aria-label': 'Edit sections for ' + u.name });
        ed.addEventListener('click', function () {
          secUser = u; $('secTitle').textContent = 'Sections for ' + u.name; checks($('secBox'), u.sections); msg('secMsg', ''); open($('secDlg'));
        });
        act.appendChild(ed);
        var rst = el('button', { type: 'button', text: 'Reset password', 'aria-label': 'Reset password for ' + u.name });
        rst.addEventListener('click', function () {
          rstUser = u; $('rstText').textContent = 'Reset the password for ' + u.name + '? Their sessions end and the new password is shown once.';
          msg('rstMsg', ''); $('rstGo').hidden = false; $('rstCancel').textContent = 'Cancel'; open($('rstDlg'));
        });
        act.appendChild(rst);
      }
      var dis = el('button', { type: 'button', 'class': u.disabled ? '' : 'danger', text: u.disabled ? 'Enable' : 'Disable', 'aria-label': (u.disabled ? 'Enable ' : 'Disable ') + u.name });
      dis.addEventListener('click', function () {
        api('POST', '/api/users/disable', { name: u.name, disabled: !u.disabled }).then(function () { return load(); }).catch(function (e) { msg('listMsg', e.message); });
      });
      act.appendChild(dis);
      tr.appendChild(act);
      rows.appendChild(tr);
    });
  }
  function load(keepMsg) {
    return api('GET', '/api/users').then(function (d) {
      sections = d.sections; render(d.users);
      if (keepMsg !== true) msg('listMsg', '');
    }).catch(function (e) { msg('listMsg', e.message); });
  }

  $('secCancel').addEventListener('click', function () { close($('secDlg')); });
  $('secForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var u = secUser; if (!u) return;
    api('POST', '/api/users/sections', { name: u.name, sections: picked($('secBox')) }).then(function () {
      close($('secDlg')); msg('listMsg', 'Sections saved for ' + u.name + '. Their sessions were ended.', true); return load(true);
    }).catch(function (e) { msg('secMsg', e.message); });
  });

  $('rstCancel').addEventListener('click', function () { close($('rstDlg')); });
  $('rstForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var u = rstUser; if (!u || $('rstGo').hidden) return;
    api('POST', '/api/users/reset-password', { name: u.name }).then(function (d) {
      $('rstText').textContent = 'Temporary password for ' + u.name + ' (shown once, copy it now):';
      var m = $('rstMsg'); m.className = 'msg ok'; m.textContent = ''; m.appendChild(el('code', { text: d.temporaryPassword }));
      $('rstGo').hidden = true; $('rstCancel').textContent = 'Done';
      return load(true);
    }).catch(function (e) { msg('rstMsg', e.message); });
  });

  function syncNew() { $('newSecs').hidden = $('newSecsLabel').hidden = $('newRole').value === 'admin'; }
  $('newRole').addEventListener('change', syncNew);
  $('addOpen').addEventListener('click', function () {
    $('newName').value = ''; $('newPass').value = ''; $('newRole').value = 'editor'; checks($('newSecs'), []); syncNew(); msg('addMsg', ''); open($('addDlg'));
    $('newName').focus();
  });
  $('addCancel').addEventListener('click', function () { close($('addDlg')); });
  $('addForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var role = $('newRole').value;
    api('POST', '/api/users', {
      name: $('newName').value.trim().toLowerCase(), role: role,
      password: $('newPass').value, sections: role === 'editor' ? picked($('newSecs')) : []
    }).then(function () {
      $('newName').value = ''; $('newPass').value = '';
      close($('addDlg')); msg('listMsg', 'User added.', true); return load(true);
    }).catch(function (e) { msg('addMsg', e.message); });
  });
  api('GET', '/api/me').then(function (d) { csrf = d.csrf; me = d.user; return load(); });
})();
</script>
</body>
</html>
