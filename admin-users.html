<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users - MarkStack Editor</title>
<script nonce="__CSP_NONCE__">
try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
</script>
<style>
  :root { color-scheme: dark; --bg:#0f1218; --panel:#151922; --raised:#1b2030; --text:#e6e9f0; --muted:#8b93a7; --line:#262c3b; --accent:#7b9bff; --accent-soft:rgba(123,155,255,.14); --on-accent:#0f1218; --err:#ff8a80; --ok:#6fd08c; --hover:#1b2030; }
  :root[data-theme="light"] { color-scheme: light; --bg:#ffffff; --panel:#f6f7f9; --raised:#eef0f4; --text:#1a1f2b; --muted:#667085; --line:#dfe3ea; --accent:#2f5bea; --accent-soft:rgba(47,91,234,.10); --on-accent:#ffffff; --err:#b3261e; --ok:#1b7f3b; --hover:#eef0f4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:600; color:var(--text); }
  .brand img { width:22px; height:22px; }
  .brand span.sub { font-weight:400; color:var(--muted); }
  label { display:block; margin:14px 0 6px; font-size:12px; font-weight:600; color:var(--muted); }
  input[type=text], input[type=password], input:not([type]), select { width:100%; height:36px; padding:0 12px; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent); }
  button { height:32px; padding:0 12px; font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  button:hover { background:var(--hover); }
  button.primary { color:var(--on-accent); background:var(--accent); border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.6; cursor:default; }
  .err { min-height:1.4em; margin-top:12px; color:var(--err); font-size:13px; }
  [hidden] { display:none !important; }
  header { display:flex; align-items:center; gap:16px; height:48px; padding:0 24px; border-bottom:1px solid var(--line); background:var(--panel); }
  header .grow { flex:1; }
  main { max-width:960px; margin:24px auto; padding:0 16px; }
  h1 { margin:0 0 4px; font-size:22px; }
  p.lead { margin:0 0 20px; color:var(--muted); }
  section { margin-bottom:24px; padding:20px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  h2 { margin:0 0 12px; font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:10px 8px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td { border-bottom:0; }
  th { font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  td.u { font-weight:600; }
  .pill { display:inline-block; margin-left:6px; padding:0 8px; border:1px solid var(--line); border-radius:10px; font-size:11px; font-weight:500; color:var(--muted); text-transform:capitalize; }
  .pill.warn { color:var(--err); border-color:var(--err); }
  .secs { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .secs label { display:inline-flex; gap:6px; align-items:center; margin:2px 0; font-size:13px; font-weight:400; color:var(--text); }
  td > button { margin-top:8px; }
  .row-form { max-width:360px; }
  .msg { min-height:1.4em; margin-top:10px; font-size:13px; }
  .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
  code { padding:2px 6px; background:var(--bg); border:1px solid var(--line); border-radius:5px; user-select:all; font-family:"IBM Plex Mono", ui-monospace, monospace; }
  .muted { color:var(--muted); font-size:13px; }
  .actions button { margin:2px 6px 2px 0; }
  @media (max-width:720px) {
    header { padding:0 12px; }
    main { margin:16px auto; }
    section { padding:14px; }
    table, tbody, tr, td { display:block; width:100%; }
    thead { display:none; }
    tr { padding:12px 0; border-bottom:1px solid var(--line); }
    tr:last-child { border-bottom:0; }
    td { border:0; padding:4px 0; }
    td[data-label]::before { content:attr(data-label); display:block; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
    button { height:38px; }
  }
</style>
</head>
<body>
<header><div class="brand"><img src="/svg/logo.svg" alt="" width="22" height="22"><span>MarkStack</span><span class="sub">Users</span></div><span class="grow"></span><a href="/">Back to the editor</a></header>
<main>
  <h1>Users and sections</h1>
  <p class="lead">Editors can change only the sections you give them. Administrators can change everything.</p>
  <section>
    <h2>Accounts</h2>
    <table><thead><tr><th>User</th><th>Role</th><th>Sections</th><th></th></tr></thead><tbody id="rows"></tbody></table>
    <div class="msg" id="listMsg" role="status"></div>
  </section>
  <section>
    <h2>Add a user</h2>
    <div class="row-form">
    <label for="newName">Username (lowercase letters, digits, . _ -)</label>
    <input id="newName" type="text" autocomplete="off">
    <label for="newRole">Role</label>
    <select id="newRole"><option value="editor">Editor</option><option value="admin">Administrator</option></select>
    <label for="newPass">Initial password (at least 12 characters)</label>
    <input id="newPass" type="password" autocomplete="new-password">
    <label id="newSecsLabel">Sections this editor may change</label>
    <div class="secs" id="newSecs"></div>
    <p><button class="primary" id="addBtn">Add user</button></p>
    <div class="msg" id="addMsg" role="status"></div>
    </div>
  </section>
</main>
<script nonce="__CSP_NONCE__">
(function () {
  var csrf = null, sections = [], me = null;
  function api(method, url, body) {
    var h = {};
    if (body !== undefined) h['Content-Type'] = 'application/json';
    if (method !== 'GET') h['X-CSRF-Token'] = csrf;
    return fetch(url, { method: method, headers: h, credentials: 'same-origin', body: body === undefined ? undefined : JSON.stringify(body) })
      .then(function (r) {
        if (r.status === 401) { location.href = '/login'; return Promise.reject(new Error('signed out')); }
        return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw new Error(d.error || 'Request failed'); return d; });
      });
  }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); });
    (kids || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  function checks(selected, prefix) {
    var box = el('div', { 'class': 'secs' });
    if (!sections.length) box.appendChild(el('span', { 'class': 'muted', text: 'No section folders exist yet.' }));
    sections.forEach(function (s) {
      var cb = el('input', { type: 'checkbox', value: s, 'data-prefix': prefix });
      cb.checked = selected.indexOf(s) !== -1;
      box.appendChild(el('label', {}, [cb, document.createTextNode(s)]));
    });
    return box;
  }
  function picked(box) {
    return Array.prototype.slice.call(box.querySelectorAll('input:checked')).map(function (i) { return i.value; });
  }
  function msg(id, text, ok) { var m = document.getElementById(id); m.textContent = text || ''; m.className = 'msg ' + (text ? (ok ? 'ok' : 'err') : ''); }

  function render(users) {
    var rows = document.getElementById('rows'); rows.textContent = '';
    users.forEach(function (u) {
      var tr = el('tr');
      var nameTd = el('td', { 'class': 'u', 'data-label': 'User', text: u.name });
      if (u.disabled) nameTd.appendChild(el('span', { 'class': 'pill warn', text: 'disabled' }));
      if (u.mustChangePassword) nameTd.appendChild(el('span', { 'class': 'pill', text: 'must change password' }));
      tr.appendChild(nameTd);
      tr.appendChild(el('td', { 'data-label': 'Role', text: u.role }));
      var secTd = el('td', { 'data-label': 'Sections' });
      if (u.role === 'admin') secTd.appendChild(el('span', { 'class': 'muted', text: 'All sections' }));
      else {
        var box = checks(u.sections, u.name); secTd.appendChild(box);
        secTd.appendChild(el('button', { text: 'Save sections' })).addEventListener('click', function () {
          api('POST', '/api/users/sections', { name: u.name, sections: picked(box) }).then(function () { msg('listMsg', 'Sections saved for ' + u.name + '. Their sessions were ended.', true); }).catch(function (e) { msg('listMsg', e.message); });
        });
      }
      tr.appendChild(secTd);
      var act = el('td', { 'class': 'actions', 'data-label': 'Actions' });
      var dis = el('button', { text: u.disabled ? 'Enable' : 'Disable' });
      dis.addEventListener('click', function () {
        api('POST', '/api/users/disable', { name: u.name, disabled: !u.disabled }).then(load).catch(function (e) { msg('listMsg', e.message); });
      });
      act.appendChild(dis);
      if (u.role === 'editor') {
        var rst = el('button', { text: 'Reset password' });
        rst.addEventListener('click', function () {
          if (!confirm('Reset the password for ' + u.name + '? Their sessions end and the new password is shown once.')) return;
          api('POST', '/api/users/reset-password', { name: u.name }).then(function (d) {
            var m = document.getElementById('listMsg'); m.className = 'msg ok'; m.textContent = 'Temporary password for ' + u.name + ' (shown once): ';
            m.appendChild(el('code', { text: d.temporaryPassword }));
            load(true);
          }).catch(function (e) { msg('listMsg', e.message); });
        });
        act.appendChild(rst);
      }
      tr.appendChild(act);
      rows.appendChild(tr);
    });
  }
  function load(keepMsg) {
    return api('GET', '/api/users').then(function (d) {
      sections = d.sections; render(d.users);
      var ns = document.getElementById('newSecs'); ns.textContent = ''; ns.appendChild(checks([], 'new'));
      if (keepMsg !== true) msg('listMsg', '');
    }).catch(function (e) { msg('listMsg', e.message); });
  }
  document.getElementById('newRole').addEventListener('change', function () {
    document.getElementById('newSecs').hidden = document.getElementById('newSecsLabel').hidden = this.value === 'admin';
  });
  document.getElementById('addBtn').addEventListener('click', function () {
    var role = document.getElementById('newRole').value;
    api('POST', '/api/users', {
      name: document.getElementById('newName').value.trim().toLowerCase(), role: role,
      password: document.getElementById('newPass').value, sections: role === 'editor' ? picked(document.getElementById('newSecs')) : []
    }).then(function () {
      document.getElementById('newName').value = ''; document.getElementById('newPass').value = '';
      msg('addMsg', 'User added.', true); load();
    }).catch(function (e) { msg('addMsg', e.message); });
  });
  api('GET', '/api/me').then(function (d) { csrf = d.csrf; me = d.user; return load(); });
})();
</script>
</body>
</html>
