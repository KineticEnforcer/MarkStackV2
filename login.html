<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - MarkStack Editor</title>
<script nonce="__CSP_NONCE__">
try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
</script>
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<style>
  :root { color-scheme: dark; --bg:#0f1218; --panel:#151922; --raised:#1b2030; --text:#e6e9f0; --muted:#8b93a7; --line:#262c3b; --accent:#7b9bff; --accent-soft:rgba(123,155,255,.14); --on-accent:#0f1218; --err:#ff8a80; --ok:#6fd08c; --hover:#1b2030; }
  :root[data-theme="light"] { color-scheme: light; --bg:#ffffff; --panel:#f6f7f9; --raised:#eef0f4; --text:#1a1f2b; --muted:#667085; --line:#dfe3ea; --accent:#2f5bea; --accent-soft:rgba(47,91,234,.10); --on-accent:#ffffff; --err:#b3261e; --ok:#1b7f3b; --hover:#eef0f4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:600; color:var(--text); }
  .brand img { width:22px; height:22px; }
  .brand span.sub { font-weight:400; color:var(--muted); }
  label { display:block; margin:14px 0 6px; font-size:12px; font-weight:600; color:var(--muted); }
  input[type=text], input[type=password], input:not([type]), select { width:100%; height:36px; padding:0 12px; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent); }
  button { height:32px; padding:0 12px; font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  button:hover { background:var(--hover); }
  button.primary { color:var(--on-accent); background:var(--accent); border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.6; cursor:default; }
  .err { min-height:1.4em; margin-top:12px; color:var(--err); font-size:13px; }
  [hidden] { display:none !important; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; }
  main { width:100%; max-width:380px; margin:16px; padding:28px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  main .brand { margin-bottom:22px; }
  h1 { margin:0 0 4px; font-size:20px; line-height:1.3; }
  p.sub { margin:0 0 6px; color:var(--muted); font-size:13px; }
  button[type=submit] { width:100%; height:38px; margin-top:22px; color:var(--on-accent); background:var(--accent); border-color:var(--accent); font-weight:600; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/svg/logo.svg" alt="" width="22" height="22"><span>MarkStack</span></div>
  <form id="login" autocomplete="on">
    <h1>Sign in</h1>
    <p class="sub">Sign in to continue.</p>
    <label for="name">Username</label>
    <input id="name" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
  <form id="change" autocomplete="off" hidden>
    <h1>Choose a new password</h1>
    <p class="sub">An administrator reset your password. Choose your own to continue (at least 12 characters).</p>
    <label for="cur">Current (temporary) password</label>
    <input id="cur" type="password" autocomplete="current-password" required>
    <label for="next">New password</label>
    <input id="next" type="password" autocomplete="new-password" required minlength="12">
    <button type="submit">Save and continue</button>
    <div class="err" id="changeErr" role="alert"></div>
  </form>
</main>
<script nonce="__CSP_NONCE__">
(function () {
  var login = document.getElementById('login'), change = document.getElementById('change');
  function post(url, body, csrf) {
    var h = { 'Content-Type': 'application/json' };
    if (csrf) h['X-CSRF-Token'] = csrf;
    return fetch(url, { method: 'POST', headers: h, body: JSON.stringify(body), credentials: 'same-origin' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, data: d }; }); });
  }
  var csrf = null;
  login.addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = login.querySelector('button'); btn.disabled = true;
    document.getElementById('loginErr').textContent = '';
    post('/api/login', { name: document.getElementById('name').value.trim().toLowerCase(), password: document.getElementById('password').value })
      .then(function (r) {
        btn.disabled = false;
        if (!r.ok) { document.getElementById('loginErr').textContent = r.data.error || 'Sign in failed'; return; }
        csrf = r.data.csrf;
        if (r.data.user.mustChangePassword) {
          document.getElementById('cur').value = document.getElementById('password').value;
          login.hidden = true; change.hidden = false; document.getElementById('next').focus();
        } else { location.href = '/'; }
      }).catch(function () { btn.disabled = false; document.getElementById('loginErr').textContent = 'Could not reach the server'; });
  });
  change.addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = change.querySelector('button'); btn.disabled = true;
    document.getElementById('changeErr').textContent = '';
    post('/api/change-password', { current: document.getElementById('cur').value, password: document.getElementById('next').value }, csrf)
      .then(function (r) {
        btn.disabled = false;
        if (!r.ok) { document.getElementById('changeErr').textContent = r.data.error || 'Could not change password'; return; }
        location.href = '/';
      }).catch(function () { btn.disabled = false; document.getElementById('changeErr').textContent = 'Could not reach the server'; });
  });
})();
</script>
</body>
</html>
