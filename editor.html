<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script nonce="__CSP_NONCE__">
    // If the CDN libraries did not load (offline, blocked), keep the editor
    // working without highlighting and diagrams instead of stopping at startup.
    window.hljs = window.hljs || { getLanguage: function () { return false; }, highlight: function () { return { value: '' }; } };
    window.mermaid = window.mermaid || { initialize: function () {}, render: function () { return Promise.reject(new Error('Mermaid did not load')); } };
    (function() {
      const theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <script nonce="__CSP_NONCE__">
    // Sign-in support: add the CSRF token to every change request and go to
    // the sign-in page when the session is gone.
    (function() {
      const nativeFetch = window.fetch.bind(window);
      let csrf = null;
      const ready = nativeFetch('/api/me', { credentials: 'same-origin' }).then(r => {
        if (r.status === 401) { location.href = '/login'; return null; }
        return r.json();
      }).then(d => {
        if (!d) return;
        csrf = d.csrf;
        window.__markstackUser = d.user;
        if (d.user.mustChangePassword) { location.href = '/login'; return; }
        document.addEventListener('DOMContentLoaded', () => {
          const slot = document.querySelector('.editor-actions');
          if (!slot) return;
          const wrap = document.createElement('div');
          wrap.className = 'user-menu';
          const who = document.createElement('span');
          who.className = 'user-menu-name';
          who.textContent = d.user.name;
          const role = document.createElement('span');
          role.className = 'user-menu-role';
          role.textContent = d.user.role;
          wrap.appendChild(who);
          wrap.appendChild(role);
          if (d.user.role === 'admin') {
            const a = document.createElement('a'); a.href = '/admin/users'; a.textContent = 'Users'; a.className = 'user-menu-link';
            wrap.appendChild(a);
          }
          const out = document.createElement('a'); out.href = '#'; out.textContent = 'Sign out'; out.className = 'user-menu-link';
          out.addEventListener('click', async e => {
            e.preventDefault();
            try { Object.keys(sessionStorage).filter(k => k.indexOf('editor-tree-open:') === 0).forEach(k => sessionStorage.removeItem(k)); } catch (err) {}
            await nativeFetch('/api/logout', { method: 'POST', headers: { 'X-CSRF-Token': csrf, 'Content-Type': 'application/json' }, body: '{}', credentials: 'same-origin' });
            location.href = '/login';
          });
          wrap.appendChild(out);
          slot.insertBefore(wrap, slot.firstChild);
        });
      });
      window.__markstackReady = ready.then(() => window.__markstackUser || null);
      window.fetch = async function(input, init) {
        init = init || {};
        const method = String(init.method || 'GET').toUpperCase();
        if (method !== 'GET' && method !== 'HEAD') {
          await ready;
          init.headers = Object.assign({}, init.headers, { 'X-CSRF-Token': csrf });
        }
        const res = await nativeFetch(input, init);
        if (res.status === 401) location.href = '/login';
        return res;
      };
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkStack Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/hljs-theme.css">
  <link rel="icon" href="/svg/logo.svg" type="image/svg+xml">
  <style>
    /* ============================================
       Editor-Specific Styles
       ============================================ */
    
    * {
      box-sizing: border-box;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    
    body {
      padding-top: 0;
      display: flex;
      flex-direction: column;
    }
    
    /* Editor Header */
    .editor-header {
      height: 60px;
      background-color: var(--color-bg-secondary);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-lg);
      flex-shrink: 0;
    }
    
    .editor-logo {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      color: var(--color-text-primary);
      font-weight: 600;
      font-size: var(--font-size-lg);
      text-decoration: none;
    }
    
    .editor-logo:hover {
      text-decoration: none;
    }
    
    .editor-logo img {
      width: 32px;
      height: 32px;
    }
    
    .editor-title {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }
    
    .editor-title-text {
      color: var(--color-text-secondary);
      font-weight: 400;
    }
    
    .editor-actions {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }
    
    .editor-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      height: 36px;
      padding: 0 var(--space-md);
      background-color: var(--color-bg-tertiary);
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius);
      color: var(--color-text-secondary);
      font-size: var(--font-size-sm);
      font-family: var(--font-sans);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .editor-btn:hover {
      background-color: var(--color-bg-hover);
      color: var(--color-text-primary);
    }
    
    .editor-btn.primary {
      background-color: var(--color-accent);
      border-color: var(--color-accent);
      color: white;
    }
    
    .editor-btn.primary:hover {
      background-color: var(--color-accent-hover);
    }
    
    .editor-btn.danger {
      background-color: var(--color-caution-border);
      border-color: var(--color-caution-border);
      color: white;
    }
    
    .editor-btn.danger:hover {
      background-color: #b91c1c;
    }
    
    .confirm-modal-message {
      color: var(--color-text-secondary);
      font-size: var(--font-size-base);
      line-height: 1.5;
      margin: 0;
    }
    
    .editor-btn svg {
      width: 16px;
      height: 16px;
    }
    
    /* Theme toggle - same style as site */
    .theme-toggle {
      width: 36px;
      height: 36px;
    }
    
    /* Main Editor Layout */
    .editor-main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    /* File Tree Panel */
    .file-tree-panel {
      width: 280px;
      background-color: var(--color-bg-secondary);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    
    .file-tree-header {
      padding: var(--space-md);
      border-bottom: 1px solid var(--color-border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .file-tree-title {
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--color-text-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .file-tree-actions {
      display: flex;
      gap: var(--space-xs);
    }
    
    .file-tree-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--border-radius);
      color: var(--color-text-tertiary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .file-tree-btn:hover {
      background-color: var(--color-bg-hover);
      border-color: var(--color-border);
      color: var(--color-text-primary);
    }
    
    .file-tree-btn svg {
      width: 16px;
      height: 16px;
    }
    
    .file-tree-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-sm);
    }
    
    /* File Tree Items */
    .tree-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    
    .tree-list .tree-list {
      padding-left: var(--space-md);
    }
    
    .tree-item {
      margin-bottom: 2px;
    }
    
    .tree-item-header {
      display: flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: background-color var(--transition-fast);
      gap: var(--space-xs);
    }
    
    .tree-item-header:hover {
      background-color: var(--color-bg-hover);
    }
    
    .tree-item-header.active {
      background-color: var(--color-bg-hover);
      color: var(--color-text-link);
    }
    
    .tree-item-header.active .tree-icon {
      color: var(--color-text-link);
    }
    
    .tree-chevron {
      width: 16px;
      height: 16px;
      color: var(--color-text-tertiary);
      flex-shrink: 0;
      transition: transform var(--transition-fast);
    }
    
    .tree-chevron.expanded {
      transform: rotate(90deg);
    }
    
    .tree-chevron.hidden {
      visibility: hidden;
    }
    
    .tree-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--color-text-secondary);
    }
    
    .tree-name {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    
    .tree-item-header:hover .tree-name,
    .tree-item-header.active .tree-name {
      color: var(--color-text-primary);
    }
    
    .tree-children {
      display: none;
    }
    
    .tree-children.expanded {
      display: block;
    }
    
    /* Editor Panel */
    .editor-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    
    .editor-toolbar {
      height: 44px;
      background-color: var(--color-bg-secondary);
      border-bottom: 1px solid var(--color-border-subtle);
      display: flex;
      align-items: center;
      padding: 0 var(--space-md);
      gap: var(--space-md);
    }
    
    .editor-file-path {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      font-family: var(--font-mono);
    }
    
    .editor-file-path .path-segment {
      color: var(--color-text-tertiary);
    }
    
    .editor-file-path .path-file {
      color: var(--color-text-primary);
      font-weight: 500;
    }
    
    .editor-unsaved {
      font-size: var(--font-size-xs);
      color: var(--color-warning-text);
      background-color: var(--color-warning-bg);
      padding: 2px 8px;
      border-radius: 10px;
      display: none;
    }
    
    .editor-unsaved.visible {
      display: inline-block;
    }
    
    .editor-toolbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }
    
    .scroll-sync-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      padding: 4px 10px;
      background-color: var(--color-bg-tertiary);
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius);
      color: var(--color-text-secondary);
      font-family: var(--font-sans);
      font-size: var(--font-size-xs);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .scroll-sync-btn:hover {
      background-color: var(--color-bg-hover);
      color: var(--color-text-primary);
    }
    
    .scroll-sync-btn.active {
      background-color: var(--color-accent-subtle);
      border-color: var(--color-accent);
      color: var(--color-accent);
    }
    
    .scroll-sync-btn svg {
      width: 14px;
      height: 14px;
    }
    
    .scroll-sync-btn .icon-locked {
      display: none;
    }
    
    .scroll-sync-btn .icon-unlocked {
      display: block;
    }
    
    .scroll-sync-btn.active .icon-locked {
      display: block;
    }
    
    .scroll-sync-btn.active .icon-unlocked {
      display: none;
    }
    
    .editor-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    /* Split View */
    .split-editor {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--color-border);
      min-width: 0;
      transition: flex var(--transition-normal), min-width var(--transition-normal), opacity var(--transition-normal);
    }
    
    /* Collapsed editor state */
    .editor-collapsed .split-editor {
      flex: 0;
      min-width: 0;
      max-width: 0;
      overflow: hidden;
      opacity: 0;
      border-right: none;
    }
    
    .editor-collapsed .split-preview {
      flex: 1;
    }
    
    .editor-collapsed .editor-collapse-toggle .collapse-icon {
      display: none;
    }
    
    .editor-collapsed .editor-collapse-toggle .expand-icon {
      display: block;
    }
    
    /* Editor Collapse Toggle Button - positioned at left edge of preview */
    .editor-collapse-toggle {
      position: absolute;
      top: 50%;
      left: -16px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      color: var(--color-text-secondary);
      cursor: pointer;
      border-radius: var(--border-radius);
      transition: all var(--transition-fast);
      z-index: 10;
    }
    
    .editor-collapse-toggle:hover {
      background-color: var(--color-bg-hover);
      color: var(--color-text-primary);
    }
    
    .editor-collapse-toggle .expand-icon {
      display: none;
    }
    
    .editor-collapse-toggle .collapse-icon {
      display: block;
    }
    
    /* When collapsed, button stays at left edge of preview */
    .editor-collapsed .editor-collapse-toggle {
      left: var(--space-sm);
    }
    
    /* Preview needs position relative for the button */
    .split-preview {
      position: relative;
    }
    
    .split-header {
      height: 36px;
      background-color: var(--color-bg-tertiary);
      border-bottom: 1px solid var(--color-border-subtle);
      display: flex;
      align-items: center;
      padding: 0 var(--space-md);
      font-size: var(--font-size-xs);
      font-weight: 600;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .split-preview {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    
    /* Markdown Editor */
    .markdown-editor {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .markdown-textarea {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      padding: var(--space-md);
      background-color: transparent;
      border: none;
      color: var(--color-text-primary);
      font-family: var(--font-mono);
      font-size: var(--font-size-sm);
      line-height: 1.6;
      resize: none;
      outline: none;
      caret-color: var(--color-text-primary);
      /* Make text invisible but keep caret visible */
      -webkit-text-fill-color: transparent;
      overflow-y: auto;
    }
    
    .markdown-textarea::placeholder {
      -webkit-text-fill-color: var(--color-text-tertiary);
      color: var(--color-text-tertiary);
    }
    
    /* Line numbers container */
    .editor-with-lines {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    /* Highlight container - holds both backdrop and textarea */
    .editor-highlight-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    
    /* Syntax highlight backdrop */
    .markdown-highlight {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      padding: var(--space-md);
      font-family: var(--font-mono);
      font-size: var(--font-size-sm);
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-y: auto;
      pointer-events: none;
      color: var(--color-text-primary);
      background-color: var(--color-bg-primary);
    }
    
    /* Markdown syntax highlighting colors */
    .md-header { color: #d2a8ff; font-weight: bold; }
    .md-bold { color: var(--color-text-primary); font-weight: bold; }
    .md-italic { color: var(--color-text-primary); font-style: italic; }
    .md-code { color: #a5d6ff; background-color: rgba(110, 118, 129, 0.2); border-radius: 3px; }
    .md-code-block { color: #8b949e; }
    .md-code-fence { color: #8b949e; }
    .md-code-content { /* inherits hljs colors */ }
    .md-link-text { color: #58a6ff; }
    .md-link-url { color: #8b949e; }
    .md-list { color: #ff7b72; }
    .md-blockquote { color: #8b949e; }
    .md-hr { color: #484f58; }
    .md-frontmatter { color: #7ee787; }
    .md-alert { color: #d29922; font-weight: bold; }
    
    [data-theme="light"] .md-header { color: #8250df; }
    [data-theme="light"] .md-code { color: #0a3069; background-color: rgba(175, 184, 193, 0.2); }
    [data-theme="light"] .md-code-block { color: #6e7781; }
    [data-theme="light"] .md-code-fence { color: #6e7781; }
    [data-theme="light"] .md-link-text { color: #0969da; }
    [data-theme="light"] .md-link-url { color: #6e7781; }
    [data-theme="light"] .md-list { color: #cf222e; }
    [data-theme="light"] .md-blockquote { color: #6e7781; }
    [data-theme="light"] .md-hr { color: #d0d7de; }
    [data-theme="light"] .md-frontmatter { color: #116329; }
    [data-theme="light"] .md-alert { color: #9a6700; }
    
    .line-numbers {
      width: 50px;
      padding: var(--space-md) var(--space-sm);
      background-color: var(--color-bg-secondary);
      border-right: 1px solid var(--color-border-subtle);
      font-family: var(--font-mono);
      font-size: var(--font-size-sm);
      line-height: 1.6;
      color: var(--color-text-tertiary);
      text-align: right;
      user-select: none;
      overflow: hidden;
    }
    
    .line-number {
      height: 1.6em;
    }
    
    /* Preview Panel */
    .preview-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-xl);
      background-color: var(--color-bg-primary);
    }
    
    .preview-article {
      max-width: 100%;
    }

    /* The preview is rendered inside a sandboxed iframe: no scripts run in it. */
    .preview-content.is-framed {
      padding: 0;
      overflow: hidden;
      display: flex;
    }
    .preview-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      background-color: var(--color-bg-primary);
    }
    
    /* Use article styles from main.css */
    .preview-article h1, .preview-article h2, .preview-article h3,
    .preview-article h4, .preview-article h5, .preview-article h6 {
      color: var(--color-text-primary);
      font-weight: 600;
      line-height: 1.3;
      margin-top: var(--space-xl);
      margin-bottom: var(--space-md);
    }
    
    .preview-article h1 {
      font-size: var(--font-size-3xl);
      padding-bottom: var(--space-md);
      border-bottom: 1px solid var(--color-border);
      margin-top: 0;
    }
    
    .preview-article h2 {
      font-size: var(--font-size-2xl);
      padding-bottom: var(--space-sm);
      border-bottom: 1px solid var(--color-border-subtle);
    }
    
    .preview-article h3 { font-size: var(--font-size-xl); }
    .preview-article h4 { font-size: var(--font-size-lg); }
    .preview-article h5, .preview-article h6 { font-size: var(--font-size-base); }
    
    .preview-article p { margin-bottom: var(--space-md); }
    
    .preview-article ul, .preview-article ol {
      margin-bottom: var(--space-md);
      padding-left: var(--space-xl);
    }
    
    .preview-article li { margin-bottom: var(--space-xs); }
    
    .preview-article code {
      font-family: var(--font-mono);
      font-size: 0.9em;
      background-color: var(--color-code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--color-code-border);
    }
    
    .preview-article pre {
      margin-bottom: var(--space-md);
      border-radius: var(--border-radius);
      overflow-x: auto;
    }
    
    .preview-article pre code {
      display: block;
      padding: var(--space-md);
      background-color: var(--color-code-bg);
      border: 1px solid var(--color-code-border);
      border-radius: var(--border-radius);
      font-size: var(--font-size-sm);
      line-height: 1.5;
    }
    
    .preview-article pre.hljs {
      background-color: var(--color-code-bg);
      border: 1px solid var(--color-code-border);
      border-radius: var(--border-radius);
      margin-bottom: var(--space-md);
    }
    
    .preview-article pre.hljs code {
      border: none;
      padding: var(--space-md);
    }
    
    .preview-article blockquote {
      margin: 0 0 var(--space-md) 0;
      padding: var(--space-md) var(--space-lg);
      border-left: 4px solid var(--color-border);
      background-color: var(--color-bg-secondary);
      border-radius: 0 var(--border-radius) var(--border-radius) 0;
      color: var(--color-text-secondary);
    }
    
    .preview-article blockquote > p:last-child { margin-bottom: 0; }
    
    .preview-article table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: var(--space-md);
      font-size: var(--font-size-sm);
    }
    
    .preview-article th, .preview-article td {
      padding: var(--space-sm) var(--space-md);
      text-align: left;
      border: 1px solid var(--color-border);
    }
    
    .preview-article th {
      background-color: var(--color-bg-secondary);
      font-weight: 700;
    }
    
    .preview-article hr {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: var(--space-xl) 0;
    }
    
    .preview-article a {
      color: var(--color-text-link);
      text-decoration: none;
    }
    
    .preview-article a:hover {
      text-decoration: underline;
    }
    
    /* GitHub-style Alerts in Preview */
    .preview-article blockquote.alert {
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--border-radius);
    }
    
    .preview-article .alert-title {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      font-weight: 600;
      margin-bottom: var(--space-xs);
      font-size: var(--font-size-sm);
    }
    
    .preview-article .alert-icon {
      display: inline-flex;
      width: 16px;
      height: 16px;
    }
    
    .preview-article .alert-icon svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    
    .preview-article .alert-note {
      background-color: var(--color-note-bg);
      border-left-color: var(--color-note-border);
    }
    .preview-article .alert-note .alert-title { color: var(--color-note-text); }
    
    .preview-article .alert-tip {
      background-color: var(--color-tip-bg);
      border-left-color: var(--color-tip-border);
    }
    .preview-article .alert-tip .alert-title { color: var(--color-tip-text); }
    
    .preview-article .alert-important {
      background-color: var(--color-important-bg);
      border-left-color: var(--color-important-border);
    }
    .preview-article .alert-important .alert-title { color: var(--color-important-text); }
    
    .preview-article .alert-warning {
      background-color: var(--color-warning-bg);
      border-left-color: var(--color-warning-border);
    }
    .preview-article .alert-warning .alert-title { color: var(--color-warning-text); }
    
    .preview-article .alert-caution {
      background-color: var(--color-caution-bg);
      border-left-color: var(--color-caution-border);
    }
    .preview-article .alert-caution .alert-title { color: var(--color-caution-text); }
    
    /* Task list checkboxes */
    .preview-article .task-list-item {
      list-style: none;
      margin-left: -1.5em;
    }
    
    .preview-article .task-list-item input[type="checkbox"] {
      margin-right: 0.5em;
    }
    
    /* Context Menu */
    .context-menu {
      position: fixed;
      background-color: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-lg);
      min-width: 180px;
      padding: var(--space-xs) 0;
      z-index: 1000;
      display: none;
    }
    
    .context-menu.visible {
      display: block;
    }
    
    .context-menu-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .context-menu-item:hover {
      background-color: var(--color-bg-hover);
      color: var(--color-text-primary);
    }
    
    .context-menu-item.danger:hover {
      background-color: var(--color-caution-bg);
      color: var(--color-caution-text);
    }
    
    .context-menu-item svg {
      width: 16px;
      height: 16px;
    }
    
    .context-menu-separator {
      height: 1px;
      background-color: var(--color-border-subtle);
      margin: var(--space-xs) 0;
    }
    
    /* Modal Dialog */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all var(--transition-fast);
    }
    
    .modal-overlay.visible {
      opacity: 1;
      visibility: visible;
    }
    
    .modal-dialog {
      background-color: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius-lg);
      box-shadow: var(--shadow-lg);
      width: 400px;
      max-width: 90vw;
    }
    
    .modal-header {
      padding: var(--space-lg);
      border-bottom: 1px solid var(--color-border-subtle);
    }
    
    .modal-title {
      margin: 0;
      font-size: var(--font-size-lg);
      font-weight: 600;
      color: var(--color-text-primary);
    }
    
    .modal-body {
      padding: var(--space-lg);
    }
    
    .modal-input {
      width: 100%;
      padding: var(--space-sm) var(--space-md);
      background-color: var(--color-bg-tertiary);
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius);
      color: var(--color-text-primary);
      font-size: var(--font-size-base);
      font-family: var(--font-sans);
    }
    
    .modal-input:focus {
      outline: none;
      border-color: var(--color-text-link);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
    }
    
    .modal-hint {
      margin-top: var(--space-sm);
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
    }
    
    .modal-footer {
      padding: var(--space-md) var(--space-lg);
      border-top: 1px solid var(--color-border-subtle);
      display: flex;
      justify-content: flex-end;
      gap: var(--space-sm);
    }
    
    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-text-tertiary);
      padding: var(--space-xl);
      text-align: center;
    }
    
    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: var(--space-md);
      opacity: 0.5;
    }
    
    .empty-state-title {
      font-size: var(--font-size-lg);
      font-weight: 500;
      color: var(--color-text-secondary);
      margin-bottom: var(--space-sm);
    }
    
    .empty-state-text {
      font-size: var(--font-size-sm);
    }
    
    /* Status bar */
    .status-bar {
      height: 28px;
      background-color: var(--color-bg-secondary);
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-md);
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
    }
    
    .status-left, .status-right {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    
    .status-item {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
    }

    /* ============================================
       V2 editor shell: same language as the docs
       ============================================ */
    .editor-header { height: 48px; padding: 0 var(--space-lg); background-color: var(--color-bg-secondary); gap: var(--space-sm); }
    .editor-logo { font-size: var(--font-size-base); gap: var(--space-sm); margin-right: auto; }
    .editor-logo img { width: 24px; height: 24px; }
    .editor-btn { height: 32px; padding: 0 var(--space-md); border-radius: 6px; }
    .editor-btn.primary { color: #fff; }
    [data-theme="dark"] .editor-btn.primary { color: #0f1218; font-weight: 600; }
    .theme-toggle { width: 32px; height: 32px; }
    .editor-menu-btn { display: none; width: 32px; height: 32px; align-items: center; justify-content: center; background: none; border: 1px solid var(--color-border); border-radius: 6px; color: var(--color-text-secondary); cursor: pointer; padding: 0; }
    .editor-toolbar { height: 40px; }

    .user-menu { display: flex; align-items: center; gap: var(--space-sm); margin-right: var(--space-sm); font-size: var(--font-size-xs); color: var(--color-text-secondary); }
    .user-menu-name { color: var(--color-text-primary); font-weight: 500; }
    .user-menu-role { padding: 1px 7px; border: 1px solid var(--color-border); border-radius: 10px; color: var(--color-text-tertiary); text-transform: capitalize; }
    .user-menu-link { color: var(--color-text-secondary); text-decoration: none; }
    .user-menu-link:hover { color: var(--color-accent); text-decoration: none; }

    /* File navigation: group labels, one rail, one marker */
    .file-tree-panel { width: 264px; position: relative; }
    .file-tree-header { padding: 0 var(--space-sm) 0 var(--space-md); height: 40px; border-bottom: 1px solid var(--color-border); }
    .file-tree-title { font-size: 11px; letter-spacing: .07em; color: var(--color-text-tertiary); }
    .file-tree-content { position: relative; padding: var(--space-sm) var(--space-sm) var(--space-xl) 0; scrollbar-gutter: stable; overscroll-behavior: contain; scrollbar-width: thin; }
    .file-tree-content::before { content: ""; position: absolute; left: 13px; top: 8px; bottom: 8px; width: 1px; background: var(--color-border); }
    .tree-marker { position: absolute; left: 12px; top: 0; width: 3px; border-radius: 3px; background: var(--color-accent); opacity: 0; pointer-events: none; z-index: 1; transition: transform 260ms cubic-bezier(.3,.7,.2,1), height 260ms cubic-bezier(.3,.7,.2,1), opacity 150ms ease; }
    .tree-list { padding: 0; }
    .tree-list.tree-level-0 { padding-left: 24px; }
    .tree-list .tree-list { padding-left: 12px; }
    .tree-list.tree-level-1 { padding-left: 0; }
    .tree-item { margin: 0; }
    .tree-item-header { position: relative; padding: 5px 4px 5px 8px; border-radius: 0 6px 6px 0; gap: 4px; min-height: 30px; }
    .tree-item-header:hover { background-color: var(--color-bg-hover); }
    .tree-item-header:focus-visible { outline: 2px solid var(--color-accent); outline-offset: -2px; }
    .tree-item-header.active { background-color: var(--color-accent-subtle); color: var(--color-accent); }
    .tree-item-header.active .tree-name { color: var(--color-accent); font-weight: 600; }
    .tree-name { font-size: 13px; white-space: normal; overflow-wrap: anywhere; text-overflow: clip; overflow: visible; }
    .tree-chevron { width: 14px; height: 14px; order: 2; margin-left: auto; transition: transform 180ms ease; }
    .tree-children { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 200ms ease; }
    .tree-children.expanded { display: grid; grid-template-rows: 1fr; }
    .tree-children-inner { overflow: hidden; min-height: 0; }
    .tree-children:not(.expanded) .tree-children-inner { visibility: hidden; transition: visibility 0s 200ms; }
    /* group labels (top-level folders) */
    .tree-group { margin-top: 16px; }
    .tree-group:first-child { margin-top: 0; }
    .tree-group > .tree-item-header { padding-left: 0; }
    .tree-group > .tree-item-header .tree-name { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-tertiary); }
    .tree-group > .tree-item-header:hover .tree-name { color: var(--color-text-primary); }
    .tree-group > .tree-item-header .tree-chevron { transform: rotate(90deg); }
    .tree-group > .tree-item-header .tree-chevron.expanded { transform: rotate(-90deg); }
    .tree-group > .tree-children > .tree-children-inner > .tree-list > .tree-item > .tree-item-header { padding-left: 8px; }
    .tree-list .tree-list .tree-list { padding-left: 12px; }
    .tree-item:not(.tree-group) > .tree-item-header .tree-chevron { order: 0; margin-left: 0; margin-right: 0; }
    .tree-item:not(.tree-group) > .tree-item-header .tree-name { order: 1; font-weight: 500; color: var(--color-text-primary); }
    .tree-item[data-type="file"] > .tree-item-header .tree-name { font-weight: 400; color: var(--color-text-secondary); }
    .tree-item[data-type="file"] > .tree-item-header.active .tree-name { color: var(--color-accent); font-weight: 600; }
    .tree-more { order: 3; flex: none; width: 24px; height: 24px; padding: 0; display: flex; align-items: center; justify-content: center; background: none; border: 0; border-radius: 5px; color: var(--color-text-tertiary); cursor: pointer; opacity: 0; }
    .tree-item-header:hover > .tree-more, .tree-item-header:focus-within > .tree-more, .tree-more:focus-visible { opacity: 1; }
    .tree-more:hover { background-color: var(--color-bg-hover); color: var(--color-text-primary); }
    @media (hover: none) { .tree-more { opacity: .7; } }
    .tree-overlay { display: none; }
    .view-switch { display: none; }
    @media (prefers-reduced-motion: reduce) { .tree-marker, .tree-children, .tree-chevron { transition: none; } }

    /* ============================================
       Phone and narrow screens: one pane at a time,
       file tree is a drawer
       ============================================ */
    @media (max-width: 800px) {
      .editor-header { padding: 0 var(--space-sm); }
      .editor-menu-btn { display: flex; }
      .editor-logo { min-width: 0; }
      .editor-logo .editor-title-text { display: none; }
      .editor-btn { padding: 0 10px; }
      #refresh-tree { font-size: 0; gap: 0; width: 32px; padding: 0; }
      #refresh-tree svg { width: 16px; height: 16px; }
      .user-menu-name, .user-menu-role { display: none; }
      .user-menu-link { white-space: nowrap; }
      .editor-logo span { display: none; }
      .line-numbers { display: none; }
      .user-menu { margin-right: 0; gap: 10px; }

      .file-tree-panel { position: fixed; z-index: 40; top: 48px; bottom: 0; left: 0; width: min(300px, 86vw); transform: translateX(-102%); transition: transform 220ms ease; box-shadow: none; }
      body.tree-drawer-open .file-tree-panel { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.4); }
      .tree-overlay { position: fixed; z-index: 30; inset: 48px 0 0 0; }
      body.tree-drawer-open .tree-overlay { display: block; }

      .editor-toolbar { padding: 0 var(--space-sm); gap: var(--space-sm); }
      .editor-file-path { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
      .editor-toolbar-right { display: none; }
      .view-switch { display: inline-flex; margin-left: auto; border: 1px solid var(--color-border); border-radius: 6px; overflow: hidden; flex: none; }
      .view-switch button { border: 0; background: none; padding: 5px 12px; font: inherit; font-size: var(--font-size-xs); color: var(--color-text-secondary); cursor: pointer; }
      .view-switch button.active { background: var(--color-accent-subtle); color: var(--color-accent); font-weight: 600; }

      .editor-content { flex-direction: column; }
      body:not(.view-preview) .split-preview { display: none !important; }
      body.view-preview .split-editor { display: none !important; }
      .split-editor, .split-preview { flex: 1; min-height: 0; border-right: 0; }
      .editor-collapse-toggle { display: none; }
      .split-header { display: none; }
      .markdown-textarea, .markdown-highlight { font-size: 16px; }
      .status-bar { padding: 0 var(--space-sm); }
      .status-right { display: none; }
      body { padding-bottom: env(safe-area-inset-bottom); }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="editor-header">
    <button class="editor-menu-btn" id="tree-toggle" type="button" aria-label="Open files" aria-expanded="false">
      <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor"><path d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75ZM1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1 0-1.5Z"/></svg>
    </button>
    <div class="editor-logo">
      <img src="/svg/logo.svg" alt="Logo">
      <span>MarkStack</span>
      <span class="editor-title-text">Editor</span>
    </div>
    
    <div class="editor-actions">
      <button class="editor-btn" id="refresh-tree" title="Refresh file tree">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
          <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
        </svg>
        Refresh
      </button>
      <button class="editor-btn primary" id="save-btn" title="Save (Ctrl+S)">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M11.997 1.414l2.59 2.59A2 2 0 0 1 15 5.413V13.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 13.5v-11A1.5 1.5 0 0 1 2.5 1h7.086a2 2 0 0 1 1.414.586l.997.828zM2 2.5v11a.5.5 0 0 0 .5.5H4v-4.5A1.5 1.5 0 0 1 5.5 8h5a1.5 1.5 0 0 1 1.5 1.5V14h1.5a.5.5 0 0 0 .5-.5V5.414a1 1 0 0 0-.293-.707l-2.59-2.59A1 1 0 0 0 10.586 2H2.5a.5.5 0 0 0-.5.5zm9 11.5V9.5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0-.5.5V14h6z"/>
        </svg>
        Save
      </button>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>
  
  <div class="tree-overlay" id="tree-overlay"></div>
  <!-- Main Editor Area -->
  <div class="editor-main">
    <!-- File Tree Panel -->
    <div class="file-tree-panel">
      <div class="file-tree-header">
        <span class="file-tree-title">Content</span>
        <div class="file-tree-actions">
          <button class="file-tree-btn" id="new-file-root" title="New File">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/>
              <path d="M8 7a.5.5 0 0 1 .5.5V10H11a.5.5 0 0 1 0 1H8.5v2.5a.5.5 0 0 1-1 0V11H5a.5.5 0 0 1 0-1h2.5V7.5A.5.5 0 0 1 8 7Z"/>
            </svg>
          </button>
          <button class="file-tree-btn" id="new-folder-root" title="New Folder">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75Zm6.25 6a.5.5 0 0 1 .5.5V9H10a.5.5 0 0 1 0 1H8.5v1.5a.5.5 0 0 1-1 0V10H6a.5.5 0 0 1 0-1h1.5V7.5a.5.5 0 0 1 .5-.5Z"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="file-tree-content" id="file-tree"></div>
    </div>
    
    <!-- Editor Panel -->
    <div class="editor-panel">
      <div class="editor-toolbar">
        <span class="editor-file-path" id="current-file-path">
          <span class="path-segment">No file selected</span>
        </span>
        <span class="editor-unsaved" id="unsaved-indicator">Unsaved</span>
        <div class="view-switch" id="view-switch" role="tablist" aria-label="View">
          <button type="button" role="tab" data-view="edit" class="active" aria-selected="true">Edit</button>
          <button type="button" role="tab" data-view="preview" aria-selected="false">Preview</button>
        </div>
        <div class="editor-toolbar-right">
          <button class="scroll-sync-btn active" id="scroll-sync-btn" title="Sync scrolling between editor and preview">
            <svg class="icon-locked" viewBox="0 0 16 16" fill="currentColor">
              <path d="M4 4a4 4 0 0 1 8 0v2h.25c.966 0 1.75.784 1.75 1.75v5.5A1.75 1.75 0 0 1 12.25 15h-8.5A1.75 1.75 0 0 1 2 13.25v-5.5C2 6.784 2.784 6 3.75 6H4Zm8.25 3.5h-8.5a.25.25 0 0 0-.25.25v5.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-5.5a.25.25 0 0 0-.25-.25ZM10.5 6V4a2.5 2.5 0 1 0-5 0v2Z"/>
            </svg>
            <svg class="icon-unlocked" viewBox="0 0 16 16" fill="currentColor">
              <path d="M5.5 4a2.5 2.5 0 0 1 5 0v2h-1V4a1.5 1.5 0 1 0-3 0v2H4V4a4 4 0 0 1 8 0v2h.25c.966 0 1.75.784 1.75 1.75v5.5A1.75 1.75 0 0 1 12.25 15h-8.5A1.75 1.75 0 0 1 2 13.25v-5.5C2 6.784 2.784 6 3.75 6H4V4a4 4 0 0 1 1.5-.001Zm-1.75 3.5a.25.25 0 0 0-.25.25v5.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-5.5a.25.25 0 0 0-.25-.25Z"/>
            </svg>
            <span class="scroll-sync-label">Sync Scroll</span>
          </button>
        </div>
      </div>
      
      <div class="editor-content">
        <!-- Empty state when no file selected -->
