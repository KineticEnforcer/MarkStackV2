<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    // Apply theme immediately to prevent flash of unstyled content (FOUC)
    (function() {
      var theme = 'dark';
      try { theme = localStorage.getItem('theme') || 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      // Tell the browser which scheme the page uses, so the canvas is dark from the first frame
      var cs = document.createElement('meta');
      cs.name = 'color-scheme';
      cs.content = theme === 'light' ? 'light' : 'dark';
      document.head.appendChild(cs);
      // Web fonts: a stylesheet added by script does not hold back the first paint
      var fl = document.createElement('link');
      fl.rel = 'stylesheet';
      fl.href = '{{baseUrl}}/vendor/fonts/fonts.css';
      document.head.appendChild(fl);
    })();
  </script>
  <script>
    // Apply sidebar state immediately to prevent layout shift
    (function() {
      var savedState = null;
      try { savedState = localStorage.getItem('sidebar-state'); } catch (e) {}
      if (savedState === 'collapsed') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  <style>
    /* Background shown before the stylesheets arrive; main.css takes over with the theme variables */
    :where(html[data-theme="dark"]) { background-color: #0f1218; }
    :where(html[data-theme="light"]) { background-color: #ffffff; }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="{{description}}">
  <!-- Fonts are added by the script above, so they never block the first paint; without JavaScript this normal link is used -->
  <noscript><link href="{{baseUrl}}/vendor/fonts/fonts.css" rel="stylesheet"></noscript>
  <meta property="og:title" content="{{title}} | {{siteTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:type" content="website">
  <title>{{title}} | {{siteTitle}}</title>
  <link rel="stylesheet" href="{{baseUrl}}/css/main.css?v=22">
  <link rel="stylesheet" href="{{baseUrl}}/css/hljs-theme.css?v=7">
  <link rel="icon" href="{{baseUrl}}/svg/logo.svg" type="image/svg+xml">
</head>
<body data-baseurl="{{baseUrl}}">
  <script>
    // Apply mobile menu state ASAP to avoid flicker on mobile nav
    (function() {
      var wasOpen = false;
      try { wasOpen = sessionStorage.getItem('mobile-menu-open') === 'true'; } catch (e) {}
      if (wasOpen) {
        document.documentElement.classList.add('mobile-menu-open');
        // Body may not exist yet; apply once ready
        if (document.body) {
          document.body.classList.add('mobile-menu-open');
          try { sessionStorage.removeItem('mobile-menu-open'); } catch (e) {}
        } else {
          document.addEventListener('DOMContentLoaded', function() {
            document.body.classList.add('mobile-menu-open');
            try { sessionStorage.removeItem('mobile-menu-open'); } catch (e) {}
          });
        }
      }
    })();
  </script>
  <header class="site-header">
    <div class="header-container">
      <a href="{{baseUrl}}/" class="site-logo">
        <img src="{{baseUrl}}/svg/logo.svg" alt="Logo" class="logo-icon" width="32" height="32">
        <span class="logo-text">{{siteTitle}}</span>
      </a>
      
      <div class="header-search">
        <div class="search-container">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" id="search-input" placeholder="Search documentation..." autocomplete="off" readonly>
          <kbd class="search-shortcut">Ctrl+K</kbd>
        </div>
      </div>
      
      <div class="header-actions">
        {{headerLinks}}
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile menu toggle - OUTSIDE header to escape backdrop-filter stacking context -->
  <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
    <svg class="menu-icon-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 12h18M3 6h18M3 18h18"></path>
    </svg>
    <svg class="menu-icon-close" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 6L6 18M6 6l12 12"></path>
    </svg>
  </button>

  <button class="sidebar-collapse-toggle" id="sidebar-toggle" title="Hide navigation" aria-label="Hide navigation" aria-expanded="true">
    <svg class="sidebar-toggle-icon collapse-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
      <path d="M7.78 12.53a.75.75 0 0 1-1.06 0L2.47 8.28a.75.75 0 0 1 0-1.06l4.25-4.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042L4.81 7h7.44a.75.75 0 0 1 0 1.5H4.81l2.97 2.97a.75.75 0 0 1 0 1.06Z"/>
    </svg>
    <svg class="sidebar-toggle-icon expand-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
      <path d="M8.22 3.47a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042l2.97-2.97H3.75a.75.75 0 0 1 0-1.5h7.44L8.22 4.53a.75.75 0 0 1 0-1.06Z"/>
    </svg>
  </button>

  <div class="mobile-overlay" id="mobile-overlay"></div>

  <div class="main-layout{{pageClass}}">
    <aside class="sidebar">
      <div class="sidebar-head"><span class="sidebar-head-label">Navigation</span></div>
      <nav class="sidebar-nav">
        {{sidebar}}
      </nav>
    </aside>
    <script>
      // Restore the navigation exactly as it was left, before the first paint:
      // folders the reader opened stay open and the list keeps its scroll position.
      (function() {
        try {
          var nav = document.querySelector('.sidebar-nav');
          var logo = document.querySelector('.site-logo');
          var scope = (logo ? logo.getAttribute('href') : '/').replace(/\/$/, '');
          var open = [];
          var raw = null;
          try { raw = localStorage.getItem('sidebar-open:' + scope); } catch (e) {}
          try { open = raw === null ? [] : JSON.parse(raw); } catch (e) {}
          if (!Array.isArray(open)) open = [];
          // First visit: every top-level group starts open, like a table of contents
          if (raw === null) {
            nav.querySelectorAll('.sidebar-level-0 > .sidebar-folder').forEach(function(li) { open.push(li.getAttribute('data-path')); });
          }
          nav.querySelectorAll('.sidebar-item.sidebar-folder').forEach(function(li) {
            if (open.indexOf(li.getAttribute('data-path')) !== -1) {
              li.dataset.state = 'expanded';
              li.classList.add('sidebar-expanded');
              var c = li.querySelector(':scope > .sidebar-children');
              if (c) c.classList.add('expanded');
              var b = li.querySelector(':scope > .sidebar-folder-header .sidebar-toggle');
              if (b) b.setAttribute('aria-expanded', 'true');
            }
          });
          var y = null;
          try { y = sessionStorage.getItem('sidebar-scroll:' + scope); } catch (e) {}
          if (y !== null) document.querySelector('.sidebar').scrollTop = parseInt(y, 10) || 0;
          // Opening a page whose row is out of view: scroll it into view now, before first paint
          var side = document.querySelector('.sidebar');
          var cur = nav.querySelector('.sidebar-current > a, .sidebar-current > .sidebar-folder-header a');
          if (cur && side.scrollHeight > side.clientHeight) {
            var sb = side.getBoundingClientRect(), cb = cur.getBoundingClientRect();
            if (cb.top < sb.top || cb.bottom > sb.bottom) side.scrollTop += cb.top - sb.top - sb.height / 3;
          }
        } catch (e) {}
        // Reveal the list now that its state is applied; allow folder animation from the next frames on
        var root = document.documentElement;
        root.classList.add('nav-ready');
        requestAnimationFrame(function() { requestAnimationFrame(function() { root.classList.add('nav-anim'); }); });
      })();
    </script>
    <noscript><style>.sidebar-nav { visibility: visible !important; }</style></noscript>
    
    <main class="content">
      <div class="content-grid">
        <article class="article">
          {{breadcrumbs}}
          {{content}}
          {{prevNext}}
        </article>
        {{toc}}
      </div>
    </main>
  </div>

  <script src="{{baseUrl}}/js/search-core.js?v=1"></script>
  <script src="{{baseUrl}}/js/app.js?v=17"></script>
  <script src="{{baseUrl}}/js/mermaid-loader.js" data-public="true"></script>
</body>
</html>
